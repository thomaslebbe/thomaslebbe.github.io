<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Thomas Lebbe · Economist</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<nav>
  <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>

  <a href="{{ '/outreach.html' | relative_url }}" {% if page.url == '/outreach.html' %}class="active"{% endif %}>Outreach</a>

</nav>

{{ content }}

<footer>
  Last updated {{ site.time | date: "%B %Y" }}.
</footer>

</body>
</html>
